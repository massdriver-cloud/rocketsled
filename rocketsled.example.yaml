# Copy to rocketsled.yaml. ${VAR} references are expanded from the environment.

server:
  addr: ":8080"
  base_url: "http://localhost:8080"              # must be reachable by GitHub/GitLab for OAuth callbacks
  session_secret: "${ROCKETSLED_SESSION_SECRET}" # 32+ random characters; also encrypts stored credentials
  session_ttl: 168h

database:
  path: data/rocketsled.db
data_dir: data                                   # per-account bootstrap working directories

massdriver:
  url: https://api.massdriver.cloud
  # shared: every account borrows the organization below (development).
  # organization: an organization is created per account with org_creator_token.
  account_mode: shared
  # The shared organization's credential. Leave both empty to read them from the
  # mass CLI profile selected by MASSDRIVER_CREDENTIAL_PATH and MASSDRIVER_PROFILE
  # (defaults: ~/.config/massdriver/config.yaml, "default").
  organization_id: "${MASSDRIVER_ORGANIZATION_ID}"
  api_key: "${MASSDRIVER_API_KEY}"
  # credential_path: ~/.config/massdriver/config.yaml
  # profile: citizens
  # org_creator_token: "${MASSDRIVER_PAT}"       # a personal access token that may create organizations

catalogs:
  dir: catalogs                                  # relative to the working directory
  # dirs: [../aws/examples/rocketsled/catalogs]  # more, relative to this file
  release_channel: stable                        # or development

tools:
  mass: mass
  tofu: tofu

auth:
  providers:
    github:
      client_id: "${GITHUB_CLIENT_ID}"
      client_secret: "${GITHUB_CLIENT_SECRET}"
    # gitlab:
    #   client_id: "${GITLAB_CLIENT_ID}"
    #   client_secret: "${GITLAB_CLIENT_SECRET}"
    # Local development only: signs everyone in as `login` with no OAuth app.
    # dev:
    #   login: alice
