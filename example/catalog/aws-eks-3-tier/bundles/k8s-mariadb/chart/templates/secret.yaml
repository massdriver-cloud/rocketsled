apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mdb.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdb.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.username | b64enc }}
  password: {{ include "mdb.secretValue" (list . "password") | b64enc }}
  root-password: {{ include "mdb.secretValue" (list . "root-password") | b64enc }}
  database: {{ .Values.database_name | b64enc }}
