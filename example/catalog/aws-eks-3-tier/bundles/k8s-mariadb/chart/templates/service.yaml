apiVersion: v1
kind: Service
metadata:
  name: {{ include "mdb.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
  selector:
    {{- include "mdb.selector" . | nindent 4 }}
