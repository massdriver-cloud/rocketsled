apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mdb.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mdb.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mdb.name" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "mdb.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mdb.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: "mariadb:{{ .Values.version }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              valueFrom: {secretKeyRef: {name: {{ include "mdb.name" . }}, key: database}}
            - name: MARIADB_USER
              valueFrom: {secretKeyRef: {name: {{ include "mdb.name" . }}, key: username}}
            - name: MARIADB_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "mdb.name" . }}, key: password}}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "mdb.name" . }}, key: root-password}}
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 60
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- include "mdb.resources" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.storage_gb }}Gi
