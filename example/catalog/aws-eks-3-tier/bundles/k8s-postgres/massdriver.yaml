name: k8s-postgres
description: >-
  A single-node PostgreSQL running as a StatefulSet in the tenant's namespace.
  Built for development and preview environments where a managed database is
  overkill.
source_url: https://github.com/massdriver-cloud/rocketsled/tree/main/example/catalog/aws-eks-3-tier/bundles/k8s-postgres
version: 0.1.0

params:
  examples:
    - __name: Development
      version: "16"
      database_name: app
      username: app
      storage_gb: 5
      size: small
    - __name: Production
      version: "16"
      database_name: app
      username: app
      storage_gb: 50
      size: large
  required:
    - version
    - database_name
    - username
    - storage_gb
    - size
  properties:
    version:
      type: string
      title: PostgreSQL version
      default: "16"
      $md.immutable: true
      oneOf:
        - const: "15"
          title: "15"
        - const: "16"
          title: "16 (current)"
        - const: "17"
          title: "17"
    database_name:
      type: string
      title: Database name
      default: app
      pattern: ^[a-z][a-z0-9_]{0,62}$
      $md.immutable: true
    username:
      type: string
      title: Application user
      description: The password is generated on first deploy and kept across upgrades.
      default: app
      pattern: ^[a-z][a-z0-9_]{0,62}$
      $md.immutable: true
    storage_gb:
      type: integer
      title: Storage (GB)
      description: Persistent volume size. Volumes grow but never shrink.
      default: 5
      minimum: 1
      maximum: 1000
    size:
      type: string
      title: Size
      default: small
      oneOf:
        - const: small
          title: Small (250m CPU, 512Mi)
        - const: medium
          title: Medium (1 CPU, 2Gi)
        - const: large
          title: Large (2 CPU, 4Gi)

dependencies:
  kubernetes_cluster:
    resource_type: kubernetes-cluster@0.0.0
    required: true

resources:
  database:
    resource_type: postgres-database@0.0.0
    required: true

steps:
  - path: chart
    provisioner: helm
    config:
      namespace: .connections.kubernetes_cluster.namespace
      timeout: 600

ui:
  ui:order:
    - version
    - database_name
    - username
    - storage_gb
    - size
    - "*"
  storage_gb:
    ui:widget: updown
