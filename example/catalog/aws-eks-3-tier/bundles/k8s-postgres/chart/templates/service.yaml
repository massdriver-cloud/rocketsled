apiVersion: v1
kind: Service
metadata:
  name: {{ include "pg.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "pg.selector" . | nindent 4 }}
