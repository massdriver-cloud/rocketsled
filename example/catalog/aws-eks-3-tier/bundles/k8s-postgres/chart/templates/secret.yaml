apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pg.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pg.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.username | b64enc }}
  password: {{ include "pg.password" . | b64enc }}
  database: {{ .Values.database_name | b64enc }}
