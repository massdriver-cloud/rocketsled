name: k8s-landing-zone
description: >-
  A tenant boundary inside a Kubernetes cluster: a namespace with quotas, limit
  ranges and network isolation, plus a deployer service account scoped to it. Emits
  a namespaced kubernetes-cluster credential to hand to application stacks.
source_url: https://github.com/massdriver-cloud/rocketsled/tree/main/example/catalog/aws-eks-3-tier/bundles/k8s-landing-zone
version: 0.1.0

params:
  examples:
    - __name: Team sandbox (small quota)
      namespace: sandbox
      quota:
        cpu: "4"
        memory: 8Gi
        pods: 30
      isolate_network: true
    - __name: Production tenant (large quota)
      namespace: prod
      quota:
        cpu: "32"
        memory: 64Gi
        pods: 200
      isolate_network: true
  required:
    - namespace
    - quota
    - isolate_network
  properties:
    namespace:
      type: string
      title: Namespace
      description: Kubernetes namespace to create. Cannot change after creation.
      pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
      message:
        pattern: "Lowercase letters, digits and hyphens, up to 63 characters."
      $md.immutable: true
    quota:
      type: object
      title: Resource quota
      description: Hard ceilings for everything running in the namespace.
      required:
        - cpu
        - memory
        - pods
      properties:
        cpu:
          type: string
          title: CPU
          description: Total requested CPU, in cores or millicores.
          default: "4"
          pattern: ^[0-9]+(m|\.[0-9]+)?$
        memory:
          type: string
          title: Memory
          default: 8Gi
          pattern: ^[0-9]+(Mi|Gi)$
        pods:
          type: integer
          title: Pods
          default: 30
          minimum: 1
          maximum: 1000
    isolate_network:
      type: boolean
      title: Isolate network
      description: Deny ingress from other namespaces. Traffic inside the namespace and from the internet via load balancers still flows.
      default: true

dependencies:
  kubernetes_cluster:
    resource_type: kubernetes-cluster@0.0.0
    required: true

resources:
  kubernetes_cluster:
    resource_type: kubernetes-cluster@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - namespace
    - quota
    - isolate_network
    - "*"
  quota:
    ui:order:
      - cpu
      - memory
      - pods
    pods:
      ui:widget: updown
