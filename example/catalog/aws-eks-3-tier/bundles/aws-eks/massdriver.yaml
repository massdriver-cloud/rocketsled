name: aws-eks
description: >-
  An EKS cluster with one managed node group in the network's private subnets.
  Emits a cluster-admin kubernetes-cluster credential that the landing zone
  bundle turns into per-tenant namespaces.
source_url: https://github.com/massdriver-cloud/rocketsled/tree/main/example/catalog/aws-eks-3-tier/bundles/aws-eks
version: 0.1.0

params:
  examples:
    - __name: Development (small on-demand nodes)
      kubernetes_version: "1.33"
      nodes:
        instance_type: t3.large
        capacity_type: ON_DEMAND
        min_size: 1
        desired_size: 2
        max_size: 3
    - __name: Production (larger nodes, room to scale)
      kubernetes_version: "1.33"
      nodes:
        instance_type: m6i.xlarge
        capacity_type: ON_DEMAND
        min_size: 3
        desired_size: 3
        max_size: 9
  required:
    - kubernetes_version
    - nodes
  properties:
    kubernetes_version:
      type: string
      title: Kubernetes version
      description: Control plane version. Upgrade one minor at a time.
      default: "1.33"
      oneOf:
        - const: "1.31"
          title: "1.31"
        - const: "1.32"
          title: "1.32"
        - const: "1.33"
          title: "1.33 (current)"
    nodes:
      type: object
      title: Node group
      required:
        - instance_type
        - capacity_type
        - min_size
        - desired_size
        - max_size
      properties:
        instance_type:
          type: string
          title: Instance type
          default: t3.large
          examples:
            - t3.large
            - m6i.large
            - m6i.xlarge
            - c6i.xlarge
        capacity_type:
          type: string
          title: Capacity
          description: Spot is far cheaper but nodes can be reclaimed with two minutes' notice.
          default: ON_DEMAND
          oneOf:
            - const: ON_DEMAND
              title: On-demand
            - const: SPOT
              title: Spot
        min_size:
          type: integer
          title: Minimum nodes
          default: 1
          minimum: 1
          maximum: 50
        desired_size:
          type: integer
          title: Desired nodes
          default: 2
          minimum: 1
          maximum: 50
        max_size:
          type: integer
          title: Maximum nodes
          default: 3
          minimum: 1
          maximum: 100

dependencies:
  aws_authentication:
    resource_type: aws-iam-role@0.0.0
    required: true
  network:
    resource_type: virtual-network@0.0.0
    required: true

resources:
  kubernetes_cluster:
    resource_type: kubernetes-cluster@0.0.0
    required: true

steps:
  - path: src
    provisioner: opentofu:1.10

ui:
  ui:order:
    - kubernetes_version
    - nodes
    - "*"
  nodes:
    ui:order:
      - instance_type
      - capacity_type
      - min_size
      - desired_size
      - max_size
    min_size:
      ui:widget: updown
    desired_size:
      ui:widget: updown
    max_size:
      ui:widget: updown
