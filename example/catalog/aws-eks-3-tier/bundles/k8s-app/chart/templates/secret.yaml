# Connection strings and credentials the container reads from the environment.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.postgres.url | default "" | quote }}
  MYSQL_URL: {{ .Values.mariadb.url | default "" | quote }}
  S3_ENDPOINT: {{ .Values.bucket.endpoint | default "" | quote }}
  S3_BUCKET: {{ .Values.bucket.name | default "" | quote }}
  S3_REGION: {{ .Values.bucket.region | default "" | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.bucket.access_key_id | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.bucket.secret_access_key | default "" | quote }}
  {{- range $k, $v := .Values.secrets }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
