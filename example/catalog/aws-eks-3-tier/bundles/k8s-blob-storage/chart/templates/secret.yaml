apiVersion: v1
kind: Secret
metadata:
  name: {{ include "minio.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
type: Opaque
data:
  access-key-id: {{ include "minio.secretValue" (list . "access-key-id" 20) | b64enc }}
  secret-access-key: {{ include "minio.secretValue" (list . "secret-access-key" 40) | b64enc }}
  bucket: {{ .Values.bucket_name | b64enc }}
