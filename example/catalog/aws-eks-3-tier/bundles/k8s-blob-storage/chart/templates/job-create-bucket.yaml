# Runs after every install and upgrade; `mc mb --ignore-existing` makes it a no-op
# once the bucket exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "minio.name" . }}-create-bucket
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "minio.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "minio.labels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          image: {{ .Values.mcImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until mc alias set local "http://{{ include "minio.name" . }}.{{ .Release.Namespace }}.svc.cluster.local:9000" "$ACCESS_KEY" "$SECRET_KEY"; do
                echo "waiting for minio"; sleep 3
              done
              mc mb --ignore-existing "local/{{ .Values.bucket_name }}"
          env:
            - name: HOME
              value: /tmp
            - name: ACCESS_KEY
              valueFrom: {secretKeyRef: {name: {{ include "minio.name" . }}, key: access-key-id}}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: {{ include "minio.name" . }}, key: secret-access-key}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
