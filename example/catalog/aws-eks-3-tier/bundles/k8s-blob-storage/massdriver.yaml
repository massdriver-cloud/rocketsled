name: k8s-blob-storage
description: >-
  S3-compatible object storage (MinIO) with one bucket, running in the tenant's
  namespace. Applications use it exactly like S3.
source_url: https://github.com/massdriver-cloud/rocketsled/tree/main/example/catalog/aws-eks-3-tier/bundles/k8s-blob-storage
version: 0.1.0

params:
  examples:
    - __name: Development
      bucket_name: uploads
      storage_gb: 10
      size: small
    - __name: Production
      bucket_name: uploads
      storage_gb: 200
      size: large
  required:
    - bucket_name
    - storage_gb
    - size
  properties:
    bucket_name:
      type: string
      title: Bucket name
      default: uploads
      minLength: 3
      maxLength: 63
      pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
      message:
        pattern: "3–63 lowercase letters, digits, dots or hyphens."
      $md.immutable: true
    storage_gb:
      type: integer
      title: Storage (GB)
      default: 10
      minimum: 1
      maximum: 5000
    size:
      type: string
      title: Size
      default: small
      oneOf:
        - const: small
          title: Small (250m CPU, 512Mi)
        - const: large
          title: Large (1 CPU, 2Gi)

dependencies:
  kubernetes_cluster:
    resource_type: kubernetes-cluster@0.0.0
    required: true

resources:
  bucket:
    resource_type: object-storage@0.0.0
    required: true

steps:
  - path: chart
    provisioner: helm
    config:
      namespace: .connections.kubernetes_cluster.namespace
      timeout: 600

ui:
  ui:order:
    - bucket_name
    - storage_gb
    - size
    - "*"
  storage_gb:
    ui:widget: updown
