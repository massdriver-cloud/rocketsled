name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify generated mocks are current
        run: |
          go generate ./...
          git diff --exit-code -- internal/domain/mocks
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: web/dist
          retention-days: 3

  build:
    name: Binary
    needs: [go, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: web/dist
      - name: Build
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o bin/rocketsled ./cmd/rocketsled
          ./bin/rocketsled version
      - uses: actions/upload-artifact@v4
        with:
          name: rocketsled-linux-amd64
          path: bin/rocketsled

  docker:
    name: Docker
    needs: [go, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rocketsled:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
